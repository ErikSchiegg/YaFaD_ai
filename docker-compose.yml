services:
  # 1. PostgreSQL
  postgres:
    image: postgres:15-alpine
    network_mode: "host"
    environment:
      POSTGRES_USER: eriks
      POSTGRES_PASSWORD: test
      POSTGRES_DB: yafad_test
    volumes:
      - pgdata:/var/lib/postgresql/data

  # 2. Grafana
  grafana:
    image: grafana/grafana:latest
    network_mode: "host"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_SERVER_HTTP_PORT=3031
    volumes:
      - grafana_data:/var/lib/grafana

  # 3. YaFaD Engine
  yafad-engine:
    build:
      context: .
      dockerfile: Dockerfile.engine
    # Die Sektion "ports" lassen wir weg, da "host" mode sie ohnehin öffnet
    network_mode: "host"
    environment:
      - DB_USER=eriks
      - DB_PASSWORD=test
      - DB_HOST=localhost # Korrekt bei network_mode: host
    volumes:
      - shared_workspace:/app/shared
    depends_on:
      - postgres

  # 4. Dashboard (Gradio)
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    network_mode: "host"
    environment:
      - DB_USER=eriks
      - DB_PASSWORD=test
      - DB_HOST=localhost
    volumes:
      - shared_workspace:/app/shared
    depends_on:
      - yafad-engine

volumes:
  pgdata:
  grafana_data:
  shared_workspace: