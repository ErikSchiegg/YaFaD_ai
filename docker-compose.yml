services:
  # 1. PostgreSQL pgvector 
  postgres:
    image: pgvector/pgvector:pg15
    container_name: postgres-1
    environment:
      POSTGRES_USER: ${DB_USER:-eriks}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-test}
      POSTGRES_DB: yafad_test
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data   # <--- KORRIGIERT: Nutzt jetzt das saubere Docker Named Volume

  # 2. Grafana
  grafana:
    image: grafana/grafana:latest
    network_mode: "host"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_SERVER_HTTP_PORT=3031
      - GF_INSTALL_PLUGINS=marcusolsson-csv-datasource
      - GF_LOG_LEVEL=warn
    volumes:
      - grafana_data:/var/lib/grafana
      - shared_workspace:/app/shared

  # 3. YaFaD Engine
  yafad-engine:
    build:
      context: .
      dockerfile: Dockerfile.engine
    network_mode: "host"
    environment:
      - DB_USER=eriks
      - DB_PASSWORD=test
      - DB_HOST=localhost 
    volumes:
      - shared_workspace:/app/shared
    depends_on:
      - postgres

  # 4. Dashboard (Gradio)
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    network_mode: "host"
    environment:
      - DB_USER=eriks
      - DB_PASSWORD=test
      - DB_HOST=localhost
    volumes:
      - shared_workspace:/app/shared
    depends_on:
      - yafad-engine

  # 5. The Fractal Time Dilation Engine
  fractal-engine:
    build:
      context: .
      dockerfile: Dockerfile.fractal
    network_mode: "host" 
    environment:
      - DB_USER=eriks
      - DB_PASSWORD=test
      - DB_HOST=localhost 
    volumes:
      - shared_workspace:/app/shared   # <--- KORRIGIERT: FEHLTE VORHER!
    depends_on:
      - postgres


volumes:
  pgdata:
  grafana_data:
  shared_workspace: